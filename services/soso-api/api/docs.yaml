openapi: 3.1.0
info:
  title: SoSo Dispatch Service API
  description: |
    Ride-sharing support system “SoSo” – HTTP API  
    All state-changing endpoints require a CSRF token (header **X-CSRF-Token**)  
    and a valid JWT Bearer token (except `/auth/login` and `/auth/csrf`).  
    Responses use camelCase; times are RFC 3339 `date-time`.
  version: 1.0.0
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      required: [message]

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
      required: [access_token, access_expires_at]

    LoginRequest:
      type: object
      properties:
        mailAddress:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [mailAddress, password]

    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
        mailAddress:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        hasCar:
          type: boolean
        capacity:
          type: integer
          minimum: 0
      required: [username, mailAddress, password]

    User:
      type: object
      properties:
        id:          { type: string, format: uuid }
        username:    { type: string }
        mailAddress: { type: string, format: email }
        hasCar:      { type: boolean }
        capacity:    { type: integer, minimum: 0 }
        createdAt:   { type: string, format: date-time }
        updatedAt:   { type: string, format: date-time }
      required: [id, username, mailAddress, hasCar, capacity]

    CalenderCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required: [name]

    Calender:
      type: object
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        description: { type: string }
        ownerId:     { type: string, format: uuid }
      required: [id, name, ownerId]

    CalenderMember:
      type: object
      properties:
        id:        { type: string, format: uuid, description: userId }
        username:  { type: string }
        hasCar:    { type: boolean }
        capacity:  { type: integer, minimum: 0 }
        sosoPoint: { type: integer, minimum: 0 }
      required: [id, username, hasCar, capacity, sosoPoint]

    EventCreateRequest:
      type: object
      properties:
        title:               { type: string, maxLength: 128 }
        description:         { type: string }
        startTime:           { type: string, format: date-time }
        endTime:             { type: string, format: date-time }
        originLocation:      { type: string, maxLength: 255 }
        destinationLocation: { type: string, maxLength: 255 }
        seatsRequiredGo:     { type: integer, minimum: 0 }
        seatsRequiredReturn: { type: integer, minimum: 0 }
        participantUserIds:
          type: array
          items: { type: string, format: uuid }
      required:
        [title, startTime, endTime, participantUserIds]

    Event:
      type: object
      properties:
        id:                  { type: string, format: uuid }
        calenderId:          { type: string, format: uuid }
        creatorId:           { type: string, format: uuid }
        title:               { type: string }
        description:         { type: string }
        startTime:           { type: string, format: date-time }
        endTime:             { type: string, format: date-time }
        originLocation:      { type: string }
        destinationLocation: { type: string }
        seatsRequiredGo:     { type: integer }
        seatsRequiredReturn: { type: integer }
        participantUserIds:
          type: array
          items: { type: string, format: uuid }
      required:
        [id, calenderId, creatorId, title, startTime, endTime,
         seatsRequiredGo, seatsRequiredReturn]

    EventDetail:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            remainingGoSeats:     { type: integer, minimum: 0 }
            remainingReturnSeats: { type: integer, minimum: 0 }
            participants:
              type: array
              items: { type: string }
          required: [remainingGoSeats, remainingReturnSeats, participants]

    EventMember:
      type: object
      properties:
        userId:    { type: string, format: uuid }
        username:  { type: string }
        sosoPoint: { type: integer, minimum: 0 }
      required: [userId, username, sosoPoint]

tags:
  - name: Auth
  - name: Users
  - name: Calenders
  - name: Events

paths:
  /auth/csrf:
    get:
      tags: [Auth]
      summary: Get a CSRF token
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrf_token: { type: string }
                required: [csrf_token]
        default: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log-in and obtain JWT / refresh cookie
      security: [{ csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "401": { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token & issue new JWT
      security: [{ csrfToken: [] }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "401": { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log-out and revoke refresh token
      security:
        - csrfToken: []
        - bearerAuth: []
      responses:
        "200": { description: Logged out }
        default: { $ref: '#/components/schemas/Error' }

  /users/register:
    post:
      tags: [Users]
      summary: Register a new user
      security: [{ csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "409": { $ref: '#/components/schemas/Error' }

  /users/me:
    get:
      tags: [Users]
      summary: Get currently authenticated user
      security:
        - csrfToken: []
        - bearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/schemas/Error' }

  /calenders/create:
    post:
      tags: [Calenders]
      summary: Create a new calender
      security:
        - csrfToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalenderCreateRequest' }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calender' }
        "409": { $ref: '#/components/schemas/Error' }

  /calenders/my:
    get:
      tags: [Calenders]
      summary: List calenders the user belongs to
      security:
        - csrfToken: []
        - bearerAuth: []
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Calender' }

  /calenders/{calender_id}/join:
    post:
      tags: [Calenders]
      summary: Join a calender
      security:
        - csrfToken: []
        - bearerAuth: []
      parameters:
        - in: path
          name: calender_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: Joined }
        "409": { $ref: '#/components/schemas/Error' }

  /calenders/{calender_id}/members:
    get:
      tags: [Calenders]
      summary: List members of a calender
      security:
        - csrfToken: []
        - bearerAuth: []
      parameters:
        - in: path
          name: calender_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CalenderMember' }

  /calenders/{calender_id}/events:
    post:
      tags: [Events]
      summary: Create an event in a calender
      security:
        - csrfToken: []
        - bearerAuth: []
      parameters:
        - in: path
          name: calender_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventCreateRequest' }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
    get:
      tags: [Events]
      summary: List events in a calender
      security:
        - csrfToken: []
        - bearerAuth: []
      parameters:
        - in: path
          name: calender_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }

  /events/{event_id}:
    get:
      tags: [Events]
      summary: Get an event (with participants)
      security:
        - csrfToken: []
        - bearerAuth: []
      parameters:
        - in: path
          name: event_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        "404": { $ref: '#/components/schemas/Error' }

  /events/{event_id}/pickup:
    post:
      tags: [Events]
      summary: Register as pick-up driver
      security:
        - csrfToken: []
        - bearerAuth: []
      parameters:
        - in: path
          name: event_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: Registered }

  /events/{event_id}/return:
    post:
      tags: [Events]
      summary: Register as return driver
      security:
        - csrfToken: []
        - bearerAuth: []
      parameters:
        - in: path
          name: event_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: Registered }

  /events/{event_id}/detail:
    get:
      tags: [Events]
      summary: Detailed event information (remaining seats etc.)
      security:
        - csrfToken: []
        - bearerAuth: []
      parameters:
        - in: path
          name: event_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }

  /events/{event_id}/members:
    get:
      tags: [Events]
      summary: List event members with SoSo points
      security:
        - csrfToken: []
        - bearerAuth: []
      parameters:
        - in: path
          name: event_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventMember' }

openapi: 3.1.0
info:
  title: SOSO 配車サポート API
  version: 0.1.0
  description: |
    SOSO配車サービスAPI。  
    認証は「アクセスJWT(Authorizationヘッダ)」＋「リフレッシュトークン(HttpOnly Cookie: rt)」の二段構成。  
    変更系エンドポイントでは CSRF トークン（X-CSRF-Token ヘッダ）を要求します。

servers:
  - url: http://localhost:8080
    description: ローカル開発用サーバ
  - url: http://localhost:8080/api
    description: /api プレフィックスを付ける構成の場合（必要に応じてパスも合わせる）

tags:
  - name: Auth
    description: 認証関連API
  - name: Users
    description: ユーザー関連API
  - name: Calenders
    description: カレンダー管理関連API
  - name: events
    description: 配車希望／配車登録関連API

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: ユーザーログイン(実装済み)
      description: |
        ユーザーを認証し、アクセスJWTを返却。リフレッシュトークンは HttpOnly Cookie `rt` に設定されます。
      security:
        - CsrfToken: []    # CSRFミドルウェア有効時
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 認証成功
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie (rt)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: アクセストークン再発行(実装済み)
      description: |
        有効なリフレッシュトークンCookieを用いてアクセストークンを再発行し、リフレッシュトークンもローテーションします。
      security:
        - RefreshCookie: []
        - CsrfToken: []
      responses:
        '200':
          description: 再発行成功
          headers:
            Set-Cookie:
              description: Rotated HttpOnly refresh token cookie (rt)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: ログアウト（実装済み）
      description: リフレッシュトークンを無効化し、Cookieを削除します。
      security:
        - RefreshCookie: []
        - CsrfToken: []
      responses:
        '204':
          description: ログアウト成功（No Content）
          headers:
            Set-Cookie:
              description: クリアされたリフレッシュトークンCookie
              schema:
                type: string
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/csrf:
    get:
      tags: [Auth]
      summary: CSRFトークン取得(実装済み)
      description: CSRFトークンを返却し、必要に応じてCookieにも設定します。
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/register:
    post:
      tags: [Users]
      summary: ユーザー登録(実装済み)
      description: 新規ユーザー登録
      operationId: createUser
      security:
        - CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/me:
    get:
      tags: [Users]
      summary: 自分のユーザー情報取得(実装済み)
      security:
        - AccessToken: []
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/list:
    get:
      tags: [Users]
      summary: ユーザー一覧取得
      description: ユーザー一覧取得（取得数制限付き）
      operationId: listUsers
      security:
        - AccessToken: []
      parameters:
        - name: limit
          in: query
          description: 取得上限件数
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: 取得開始オフセット
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCount:
                    type: integer
                  count:
                    type: integer
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /users/{id}:
    get:
      tags: [Users]
      summary: ユーザー情報取得
      operationId: getUser
      security:
        - AccessToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: ユーザー識別子
          schema:
            type: string
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'
  
  /users/update/{id}:
    put:
      tags: [Users]
      summary: ユーザー情報更新
      operationId: updateUser
      security:
        - AccessToken: []
        - CsrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: ユーザー識別子
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/delete/{id}:
    delete:
      tags: [Users]
      summary: ユーザー削除
      operationId: deleteUser
      security:
        - AccessToken: []
        - CsrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: ユーザー識別子
          schema:
            type: string
      responses:
        '204':
          description: 削除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'

  /calenders/my/:
    get:
      tags: [Calenders]
      summary: 自身の所属カレンダー一覧を取得（実装済み）
      operationId: listCalenders
      security:
        - AccessToken: []
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalenderResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /calenders/create:
    post:
        tags: [Calenders]
        summary: カレンダー作成(実装済み)
        operationId: createCalender
        security:
          - AccessToken: []
          - CsrfToken: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalenderCreateRequest'
        responses:
          '201':
            description: 作成成功（作成者は自動的に参加者(admin)として登録）
            $ref: '#/components/schemas/CalenderResponse'
          '400':
            $ref: '#/components/responses/BadRequest'
          '401':
            $ref: '#/components/responses/UnauthorizedError'
          '403':
            $ref: '#/components/responses/ForbiddenError'

  /calenders/{calenderId}:
    get:
      tags: [Calenders]
      summary: チーム詳細取得
      operationId: getCalender
      security:
        - AccessToken: []
      parameters:
        - name: calenderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalenderResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'

  /calenders/{calenderId}/members:
    get:
      tags: [Calenders]
      summary: チームメンバー一覧取得（実装済み）
      operationId: listCalenderMembers
      security:
        - AccessToken: []
      parameters:
        - name: calenderId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: 取得上限件数
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: 取得開始オフセット
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalenderMemberResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /calenders/{calenderId}/join:
    post:
      tags: [Calenders]
      summary: カレンダー参加申請(実装済み)
      operationId: joinCalender
      security:
        - AccessToken: []
        - CsrfToken: []
      parameters:
        - name: calenderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 参加申請成功
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'
  /calenders/{calenderId}/delete:
    delete:
      tags: [Calenders]
      summary: カレンダー削除
      operationId: deleteCalender
      security:
        - AccessToken: []
        - CsrfToken: []
      parameters:
        - name: calenderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'

  /calenders/{calenderId}/events:
    get:
      tags: [events]
      summary: 配車希望一覧取得（実装済み）
      operationId: listevents
      security:
        - AccessToken: []
      parameters:
        - name: calenderId
          in: path
          required: true
          schema:
            type: string
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/eventResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [events]
      summary: 配車希望登録(実装済み)
      operationId: createevent
      security:
        - AccessToken: []
        - CsrfToken: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eventCreateRequest'
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /events/{eventId}:
    get:
      tags: [events]
      summary: 配車希望取得(実装済み)
      operationId: getevent
      security:
        - AccessToken: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [events]
      summary: 配車希望更新
      operationId: updateevent
      security:
        - AccessToken: []
        - CsrfToken: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eventCreateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [events]
      summary: 配車希望削除
      operationId: deleteevent
      security:
        - AccessToken: []
        - CsrfToken: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{eventId}/members:
    get:
      tags: [events]
      summary: 予約メンバー一覧取得
      operationId: listeventMembers
      security:
        - AccessToken: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: 取得上限件数
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: 取得開始オフセット
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/eventMemberResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /events/{eventId}/histories:
    get:
      tags: [events]
      summary: SOSOポイント変更履歴取得
      operationId: get sosoPoint histories
      security:
        - AccessToken: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/eventHistoryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /events/{eventId}/participants:
    post:
      tags: [events]
      summary: 配車登録（参加）
      operationId: registerevent
      security:
        - AccessToken: []
        - CsrfToken: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 登録成功
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [events]
      summary: 配車キャンセル
      operationId: cancelevent
      security:
        - AccessToken: []
        - CsrfToken: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: キャンセル成功
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/me:
    get:
      tags: [events]
      summary: 自分の配車登録一覧取得
      operationId: listMyevents
      security:
        - AccessToken: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/eventResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /events/dispatch/me:
    get:
      tags: [events]
      summary: 自分の配車予定一覧取得（実装済み）
      description: |
        アクセスJWTの subject（=自分のユーザーID）に紐づく配車参加・送迎予定を一覧で返す。
        返却フィールドはハンドラのレスポンス整形に合わせており、`type` は文字列の列挙値である。
      operationId: listMyDispatches
      security:
        - AccessToken: []
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/transportEventResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

components:
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshCookie:
      type: apiKey
      in: cookie
      name: rt
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token

  responses:
    BadRequest:
      description: 入力値不正エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: 認証情報不正エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: 権限不足エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 競合エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 対象が存在しない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: サーバ内部エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    CsrfResponse:
      type: object
      properties:
        csrf_token:
          type: string
      required: [csrf_token]

    LoginRequest:
      type: object
      required: [mailAddress, password]
      properties:
        mailAddress:
          type: string
          description: メールアドレス
          example: hoge@example.com
        password:
          type: string
          format: password
          description: ログイン用パスワード
          example: Passw0rd!123

    TokenResponse:
      type: object
      required: [access_token, access_expires_at]
      properties:
        access_token:
          type: string
          description: アクセスJWT
        access_expires_at:
          type: string
          format: date-time
          description: アクセスJWTの有効期限

    UserCreateRequest:
      type: object
      required: [username, mailAddress, password, hasCar]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: kitano_masaki
        mailAddress:
          type: string
          example: foo@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: Passw0rd!123
        hasCar:
          type: boolean
          example: true
        capacity:
          type: integer
          format: int32
          minimum: 0
          example: 4

    UserUpdateRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        mailAddress:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        hasCar:
          type: boolean
        capacity:
          type: integer
          format: int32
          minimum: 0

    UserResponse:
      type: object
      required: [id, username, mailAddress, hasCar]
      properties:
        id:
          type: string
          example: usr_12345
        username:
          type: string
          example: kitano_masaki
        mailAddress:
          type: string
          example: foo@example.com
        hasCar:
          type: boolean
          example: true
        capacity:
